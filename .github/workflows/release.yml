name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - os: macos-13
            platform: macos
            arch: x86_64
          - os: macos-14
            platform: macos
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang cmake ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm cmake ninja
          echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-release -j

      - name: Smoke test CLI
        run: |
          ./build-release/rivet --help
          ./build-release/rivet tests/validation.rvt >/tmp/rivet-smoke.out 2>&1
          test -s /tmp/rivet-smoke.out

      - name: Package artifact
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          ARTIFACT_BASE="rivet-${TAG}-${PLATFORM}-${ARCH}"
          STAGE_DIR="dist/${ARTIFACT_BASE}"
          mkdir -p "${STAGE_DIR}/bin"
          cp build-release/rivet "${STAGE_DIR}/bin/rivet"
          cp README.md CHANGELOG.md LICENSE "${STAGE_DIR}/"
          tar -C dist -czf "dist/${ARTIFACT_BASE}.tar.gz" "${ARTIFACT_BASE}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
